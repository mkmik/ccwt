id = "ccwt"
name = "ccwt worktrees"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Open a new Herdr workspace on a fresh ccwt-managed git worktree, or a project from ccwt -g's picker."
platforms = ["linux", "macos"]

# No [[build]]: the plugin is one bash script and expects `ccwt` already on PATH.

[[actions]]
id = "new-worktree"
title = "New ccwt worktree"
description = "Create a worktree with `ccwt new` and open it as a Herdr workspace."
contexts = ["workspace"]
command = ["bash", "new-worktree.sh"]

[[actions]]
id = "open-project"
title = "Open a ccwt project"
description = "Pick a project ccwt has seen in a popup (`ccwt open`) and go to its workspace."
contexts = ["workspace"]
command = ["bash", "open-project.sh"]

# The popup `ccwt open` opens. Through bash so CCWT_BIN still works, and
# from $HOME: ccwt marks the repo it runs in as used, and a plugin linked from a
# checkout of ccwt would otherwise put ccwt on top of the picker every time.
[[panes]]
id = "picker"
title = "Open a ccwt project"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "-c", "cd && exec \"${CCWT_BIN:-ccwt}\" open --here"]
