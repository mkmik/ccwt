name: Go

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Build
        run: go build -v ./...

      # Release cross-compiles for windows and darwin, so a platform-specific
      # symbol breaks the release long after the PR that introduced it is green.
      - name: Cross-build
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
